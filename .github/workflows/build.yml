name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build -A x64
          - name: macOS
            os: macos-latest
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          - name: Linux
            os: ubuntu-24.04
            configure: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libgl1-mesa-dev xvfb fonts-dejavu-core \
            libavformat-dev libavcodec-dev libswscale-dev libswresample-dev libavutil-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Video decoding (platform decoder)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) APP="build/Transport_artefacts/Release/Transport.exe" ;;
            macOS)   APP="build/Transport_artefacts/Release/Transport.app/Contents/MacOS/Transport" ;;
            Linux)   APP="build/Transport_artefacts/Release/Transport" ;;
          esac
          "$APP" --probe-media tests/media/colors.mp4 --out probe-colors.json || true
          "$APP" --probe-media tests/media/portrait-silent.mp4 --out probe-portrait.json || true
          cat probe-colors.json; echo; cat probe-portrait.json; echo
          if [ "$RUNNER_OS" = Windows ]; then PY=python; else PY=python3; fi
          $PY tests/check_media.py probe-colors.json probe-portrait.json

      - name: UI snapshots
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p snapshots
          case "$RUNNER_OS" in
            Windows) APP="build/Transport_artefacts/Release/Transport.exe"; RUN="" ;;
            macOS)   APP="build/Transport_artefacts/Release/Transport.app/Contents/MacOS/Transport"; RUN="" ;;
            Linux)   APP="build/Transport_artefacts/Release/Transport"; RUN="xvfb-run -a" ;;
          esac
          $RUN "$APP" --snapshot snapshots/main.png
          $RUN "$APP" --snapshot snapshots/plugins.png --size 1400x900 --slots spectrum,loudness,goniometer,spectrogram,phase,scope,peakrms --cols 4 --seconds 6
          $RUN "$APP" --snapshot snapshots/browser.png --browser --seconds 1.5
          $RUN "$APP" --snapshot snapshots/video.png --file "$PWD/tests/media/colors.mp4" --seek 0.1 --seconds 0.5
          $RUN "$APP" --snapshot snapshots/video-portrait-fullscreen.png --file "$PWD/tests/media/portrait-silent.mp4" --seek 0.3 --seconds 0.5 --fullscreen --size 1280x720
          ls -la snapshots

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              cp build/Transport_artefacts/Release/Transport.exe dist/Transport-Windows-x64.exe ;;
            macOS)
              codesign --force --deep --sign - build/Transport_artefacts/Release/Transport.app
              ditto -c -k --keepParent build/Transport_artefacts/Release/Transport.app dist/Transport-macOS.zip ;;
            Linux)
              tar -C build/Transport_artefacts/Release -czf dist/Transport-Linux-x64.tar.gz Transport ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Transport-${{ matrix.name }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.name }}
          path: snapshots/*
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Transport-*
          path: dist
          merge-multiple: true

      - name: Versioned release (new version in CMakeLists.txt, or a pushed v* tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -nE 's/^project\(Transport VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          fi
          echo "Version: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released - bump the version in CMakeLists.txt to publish a new one."
            exit 0
          fi
          NOTES=".github/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || { echo "Transport ${TAG}." > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Transport ${TAG}" --notes-file "$NOTES" --latest

      - name: Rolling "latest" build (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* \
            --target "${{ github.sha }}" \
            --prerelease --latest=false \
            --title "Transport (development build)" \
            --notes "Automatic build of ${{ github.sha }} from main. For the stable version use the newest vX.Y.Z release."
